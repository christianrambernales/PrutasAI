  prevention_fil: 'Draft translation pending expert review: Remove heavily affected leaves and improve aeration around plants.'
  cultural_management_en: Reduce dense foliage and conditions that keep the canopy humid where practical.
  cultural_management_fil: 'Draft translation pending expert review: Reduce dense foliage and conditions that keep the canopy humid where practical.'
  sanitation_guidance_en: Remove affected leaves from the immediate growing area instead of leaving them beside the plant.
  sanitation_guidance_fil: 'Draft translation pending expert review: Remove affected leaves from the immediate growing area instead of leaving
    them beside the plant.'
  monitoring_signs_day_1_en: Record a clear Day 1 reference photo. Note the number, size, color, and distribution of visible leaf lesions, powdery
    growth, pustules, browning, wilting, or leaf drop already present.
  monitoring_signs_day_1_fil: Kumuha ng malinaw na Day 1 reference photo. Itala ang bilang, laki, kulay, at lokasyon ng nakikitang lesions, powdery
    growth, pustules, pag-brown, pagkalanta, o paglagas ng dahon na naroon na.
  monitoring_signs_day_5_en: Compare with Day 1. Record whether new affected leaves or lesions appeared, whether existing areas expanded, and
    whether wilting or leaf drop increased. Do not treat visual improvement as confirmation of the disease identity.
  monitoring_signs_day_5_fil: Ihambing sa Day 1. Itala kung may bagong apektadong dahon o lesions, kung lumaki ang dating apektadong bahagi, at
    kung dumami ang pagkalanta o paglagas. Huwag ituring ang pagbuti sa itsura bilang kumpirmasyon ng disease identity.
  monitoring_signs_day_10_en: Compare with Days 1 and 5. Record whether spread stopped, remained similar, or increased. Seek expert confirmation
    if lesions continue expanding, new leaves become affected, or plant vigor declines.
  monitoring_signs_day_10_fil: Ihambing sa Day 1 at Day 5. Itala kung huminto, nanatili, o dumami ang pagkalat. Humingi ng expert confirmation
    kung patuloy lumalaki ang lesions, may bagong apektadong dahon, o humihina ang halaman.
  escalation_guidance_en: Seek confirmation from a qualified agriculturist or plant pathologist if symptoms spread, plant vigor declines, fruit
    deterioration progresses, or the visible signs do not clearly match the source-defined condition.
  escalation_guidance_fil: Humingi ng kumpirmasyon mula sa qualified agriculturist o plant pathologist kung kumakalat ang sintomas, humihina ang
    halaman, lumalala ang pagkasira ng bunga, o hindi malinaw na tumutugma ang nakikitang palatandaan sa source-defined condition.
