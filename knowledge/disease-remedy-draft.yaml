- fruit: Banana
  variety: null
  disease_key: anthracnose
  disease_name_en: Banana anthracnose
  disease_name_fil: Anthracnose ng saging
  disease_scope: Specific post-harvest disease documented for banana
  field_or_postharvest: postharvest
  symptoms_en: Possible signs include black or brown sunken peel spots of varying size. Lesions may contain salmon-colored
    spore masses, and affected fruit may ripen prematurely.
  symptoms_fil: Kabilang sa mga posibleng palatandaan ang lubog na itim o kayumangging batik sa balat ng bunga na iba-iba
    ang laki. Maaaring magkaroon ng kulay-salmon na kumpol ng spores sa sugat at maaaring maagang mahinog ang apektadong bunga.
  prevention_en: Use field sanitation, careful fruit handling to avoid bruises and wounds, clean packinghouse water and equipment,
    and appropriate cool handling after harvest.
  prevention_fil: Panatilihin ang sanitasyon sa bukid, iwasang mabugbog o masugatan ang bunga, panatilihing malinis ang tubig
    at kagamitan sa packinghouse, at gumamit ng angkop na malamig na paghawak pagkatapos anihin.
  cultural_management_en: Remove dead and dying banana tissues that can harbor the pathogen.
  cultural_management_fil: Alisin ang patay at namamatay na tisyu ng saging na maaaring pamahayan ng pathogen.
  biological_or_mechanical_control_en: PCAARRD reported laboratory and pot results for HiYEAST Dh against banana anthracnose.
    The same source says the product was not commercially available and further packinghouse/production-area trials were needed.
    Treat this as experimental evidence only.
  biological_or_mechanical_control_fil: Iniulat ng PCAARRD ang laboratory at pot results ng HiYEAST Dh laban sa anthracnose
    ng saging. Sinasabi rin ng sanggunian na hindi pa ito commercially available at kailangan pa ng karagdagang packinghouse
    at production-area trials. Ituring lamang ito bilang experimental evidence.
  pesticide_product: null
  active_ingredient: null
  pesticide_target_crop: null
  pesticide_target_disease: null
  dosage: null
  concentration: null
  application_interval: null
  preharvest_interval: null
  safety_restrictions_en: Do not present HiYEAST as a currently available farmer treatment. No pesticide label claim is included.
  safety_restrictions_fil: Huwag ipakita ang HiYEAST bilang kasalukuyang available na lunas para sa magsasaka. Walang pesticide
    label claim na isinama.
  uncertainty_note_en: These signs are not a diagnosis. Confirm with an agriculturist or plant pathologist, especially when
    crown rot or other post-harvest rots are also possible.
  uncertainty_note_fil: Hindi diagnosis ang mga palatandaang ito. Magpakumpirma sa agriculturist o plant pathologist, lalo
    na kung posible rin ang crown rot o ibang post-harvest rot.
  source_id:
