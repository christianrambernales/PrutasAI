- fruit: Papaya
  variety: null
  disease_key: rot
  disease_name_en: Phytophthora rot
  disease_name_fil: Phytophthora rot ng papaya
  disease_scope: Specific disease under the broad candidate term 'rot'
  field_or_postharvest: field
  symptoms_en: Possible signs include root rot, wilt, trunk canker, and fruit rot. Affected areas may begin water-soaked and
    later develop cottony growth and spores on the surface.
  symptoms_fil: Kabilang sa mga posibleng palatandaan ang root rot, pagkalanta, canker sa puno, at fruit rot. Maaaring magsimula
    bilang water-soaked ang apektadong bahagi at kalaunan ay magkaroon ng cottony growth at spores sa ibabaw.
  prevention_en: Do not replant in areas where the disease previously occurred. Remove and destroy fallen trunks and fruits.
    Maintain good field drainage.
  prevention_fil: Huwag muling magtanim sa lugar na dati nang nagkaroon ng sakit. Alisin at sirain ang mga bumagsak na puno
    at bunga. Panatilihin ang maayos na drainage sa bukid.
