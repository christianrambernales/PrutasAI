- fruit: Banana
  variety: null
  disease_key: rot
  disease_name_en: Crown rot
  disease_name_fil: Crown rot ng saging
  disease_scope: Specific post-harvest disease under the broad candidate term 'rot'
  field_or_postharvest: postharvest
  symptoms_en: Possible signs include brown-to-black discoloration on the cut crown surface, sometimes followed by whitish
    mold and deeper dry black rot into the crown and finger necks. Severely affected fingers may detach.
  symptoms_fil: Kabilang sa mga posibleng palatandaan ang kayumanggi hanggang itim na pagkulay sa pinutol na crown surface,
    na maaaring sundan ng maputing amag at mas malalim na tuyong itim na pagkabulok sa crown at leeg ng mga daliri ng saging.
    Maaaring matanggal ang mga daliri kapag malala ang pinsala.
  prevention_en: Use field sanitation, clean packinghouse water and equipment, careful de-handing and fruit handling, and
    appropriate cool handling after harvest.
  prevention_fil: Panatilihin ang sanitasyon sa bukid, malinis na tubig at kagamitan sa packinghouse, maingat na de-handing
    at paghawak ng bunga, at angkop na malamig na paghawak pagkatapos anihin.
  cultural_management_en: Remove dead plant tissues and packinghouse debris that can serve as pathogen sources.
  cultural_management_fil: Alisin ang patay na plant tissue at debris sa packinghouse na maaaring pagmulan ng pathogen.
  biological_or_mechanical_control_en: PCAARRD reported laboratory and pot results for HiYEAST Dh against banana crown rot.
    The source states that the product was not commercially available and further trials were needed.
  biological_or_mechanical_control_fil: Iniulat ng PCAARRD ang laboratory at pot results ng HiYEAST Dh laban sa crown rot
    ng saging. Sinasabi ng sanggunian na hindi pa commercially available ang produkto at kailangan pa ng karagdagang trials.
