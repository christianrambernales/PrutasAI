- fruit: Mango
  variety: null
  disease_key: anthracnose
  disease_name_en: Anthracnose
  disease_name_fil: Anthracnose
  disease_scope: Specific fungal disease documented for mango
  field_or_postharvest: both
  symptoms_en: Possible signs include irregular brown spots on young leaves, distorted mature leaves with shot-hole-like damage,
    blackening and withering of flowers, and brown-to-black sunken fruit spots.
  symptoms_fil: Kabilang sa mga posibleng palatandaan ang hindi regular na kayumangging batik sa murang dahon, pagkabaluktot
    ng matatandang dahon na may tila butas-butas na pinsala, pag-itim at pagkalanta ng bulaklak, at lubog na kayumanggi hanggang
    itim na batik sa bunga.
  prevention_en: Maintain light penetration and air circulation, remove disease-source trash, and bag fruits using appropriate
    materials to reduce field infection.
  prevention_fil: Panatilihin ang pagpasok ng liwanag at pagdaloy ng hangin, alisin ang basurang maaaring pagmulan ng sakit,
    at balutin ang bunga gamit ang angkop na materyal upang mabawasan ang impeksiyon sa bukid.
  cultural_management_en: Prune after harvest to improve ventilation and reduce canopy humidity. Maintain tree vigor with
    appropriate cultural practices.
  cultural_management_fil: Magputol ng sanga pagkatapos ng anihan upang mapabuti ang bentilasyon at mabawasan ang halumigmig
    sa loob ng puno. Panatilihin ang sigla ng puno sa pamamagitan ng angkop na gawaing pangkultura.
  biological_or_mechanical_control_en: For post-harvest handling, the BAFS manual describes hot-water treatment. The disease-specific
    annex directs newly harvested mangoes to hot-water treatment, while Section III gives treatment schedules for mango handling.
  biological_or_mechanical_control_fil: Para sa paghawak pagkatapos anihin, inilalarawan ng manwal ng BAFS ang hot-water treatment.
    Itinuturo ng annex para sa sakit na isailalim ang bagong aning mangga sa hot-water treatment, habang nasa Section III
    ang mga iskedyul ng paggamot para sa paghawak ng mangga.
  pesticide_product: null
  active_ingredient: null
  pesticide_target_crop: null
  pesticide_target_disease: null
  dosage: null
  concentration: null
  application_interval: null
  preharvest_interval: null
  safety_restrictions_en: No pesticide product, dose, interval, or PHI is included because the cited source refers only to
    registered fungicides and does not provide a product-specific label for this crop-disease pair.
  safety_restrictions_fil: Walang isinamang partikular na produktong pestisidyo, dosis, pagitan ng aplikasyon, o PHI dahil
    pangkalahatang 'registered fungicides' lamang ang tinutukoy ng sanggunian at walang label na tiyak sa crop-disease pair
    na ito.
  uncertainty_note_en: These signs are decision-support indicators only. Similar fruit or flower lesions may have other causes.
    Seek confirmation from an agriculturist or plant pathologist.
  uncertainty_note_fil: Mga palatandaang pantulong sa pagpapasya lamang ang mga ito. Maaaring may ibang sanhi ang kahawig
    na pinsala sa bunga o bulaklak. Humingi ng kumpirmasyon mula sa agriculturist o plant pathologist.
