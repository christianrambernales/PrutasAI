- fruit: Mango
  variety: null
  disease_key: scab
  disease_name_en: Mango scab
  disease_name_fil: Scab ng mangga
  disease_scope: Specific fungal disease documented for mango
  field_or_postharvest: field
  symptoms_en: Possible signs on young developing fruit include grayish-brown spots with dark irregular margins. Enlarging
    spots may crack and form fissured corky tissue. Panicles and pedicels may also be affected.
  symptoms_fil: Kabilang sa mga posibleng palatandaan sa murang nabubuong bunga ang abong-kayumangging batik na may madilim
    at hindi regular na gilid. Kapag lumaki ang batik, maaaring magbitak at maging tila cork ang tisyu. Maaari ring maapektuhan
    ang panicle at pedicel.
  prevention_en: Use sanitation and pruning to improve light penetration and air circulation. Remove disease-source trash
    and bag fruits with appropriate materials.
  prevention_fil: Gumamit ng sanitasyon at pruning upang mapabuti ang pagpasok ng liwanag at pagdaloy ng hangin. Alisin ang
    basurang maaaring pagmulan ng sakit at balutin ang bunga gamit ang angkop na materyal.
  cultural_management_en: Prune after harvest to improve ventilation and reduce humidity inside the canopy.
  cultural_management_fil: Mag-prune pagkatapos ng anihan upang mapabuti ang bentilasyon at mabawasan ang halumigmig sa loob
    ng canopy.
  biological_or_mechanical_control_en: null
  biological_or_mechanical_control_fil: null
