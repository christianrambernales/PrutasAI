- fruit: Mango
  variety: null
  disease_key: rot
  disease_name_en: Diplodia stem-end rot
  disease_name_fil: Diplodia stem-end rot
  disease_scope: Specific disease under the broad candidate term 'rot'
  field_or_postharvest: both
  symptoms_en: Possible signs include dark lesions starting at the pedicel end after harvest, spreading toward the opposite
    end under warm, moist conditions. Affected tissue may become dark-brown to purplish black, watery, and malodorous.
  symptoms_fil: Kabilang sa mga posibleng palatandaan ang madilim na sugat na nagsisimula sa dulo ng pedicel pagkatapos anihin
    at lumalawak patungo sa kabilang dulo sa mainit at mahalumigmig na kondisyon. Maaaring maging dark-brown hanggang purplish
    black, matubig, at mabaho ang apektadong tisyu.
  prevention_en: Remove and destroy primary disease sources such as dead twigs, bark, and other plant trash. Harvest fruit
    with about 1 to 2 cm of stalk attached.
  prevention_fil: Alisin at sirain ang pangunahing pinagmumulan ng sakit gaya ng patay na sanga, balat, at iba pang plant
    debris. Anihin ang bunga na may humigit-kumulang 1 hanggang 2 cm na tangkay na nakakabit.
  cultural_management_en: Sanitation and careful harvest handling are documented.
  cultural_management_fil: Nakadokumento ang sanitasyon at maingat na pag-aani.
