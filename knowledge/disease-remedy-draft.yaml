relationships:
- fruit: Papaya
  affected_plant_part: leaf and fruit
  disease_key: anthracnose
  disease_name_en: Anthracnose
  disease_name_fil: Anthracnose
  awareness_only: false
  symptoms_en: Possible indicators include water-soaked spots that enlarge, darken, and become sunken on maturing fruit. Philippine research confirms
    papaya anthracnose caused by Colletotrichum species. Leaf involvement is retained because it is in the project applicability matrix, but the
    reviewed Philippine source is strongest for fruit.
  symptoms_fil: 'Draft translation pending expert review: Possible indicators include water-soaked spots that enlarge, darken, and become sunken
    on maturing fruit. Philippine research confirms papaya anthracnose caused by Colletotrichum species. Leaf involvement is retained because
    it is in the project applicability matrix, but the reviewed Philippine source is strongest for fruit.'
  prevention_en: Improve aeration and remove diseased fruit and plant material. Avoid fruit injury during handling.
  prevention_fil: 'Draft translation pending expert review: Improve aeration and remove diseased fruit and plant material. Avoid fruit injury
    during handling.'
  cultural_management_en: Use sanitation and careful harvest/post-harvest handling.
  cultural_management_fil: 'Draft translation pending expert review: Use sanitation and careful harvest/post-harvest handling.'
  sanitation_guidance_en: Remove infected or decaying fruit and plant debris from contact with sound produce.
  sanitation_guidance_fil: 'Draft translation pending expert review: Remove infected or decaying fruit and plant debris from contact with sound
    produce.'
  monitoring_signs_day_1_en: Record separate Day 1 reference photos of the affected leaf and fruit. Note existing lesion number, size, color,
    tissue collapse, visible growth, and fruit softness.
  monitoring_signs_day_1_fil: Kumuha ng hiwalay na Day 1 reference photo ng apektadong dahon at bunga. Itala ang bilang, laki, kulay ng lesions,
    tissue collapse, nakikitang growth, at lambot ng bunga.
  monitoring_signs_day_5_en: Compare with Day 1. Record new lesions, enlargement of existing lesions, increased discoloration, wilting, leaf drop,
    or fruit softening. Do not use improvement as proof of disease identity.
  monitoring_signs_day_5_fil: Ihambing sa Day 1. Itala ang bagong lesions, paglaki ng dating lesions, pagdami ng discoloration, pagkalanta, paglagas
    ng dahon, o paglambot ng bunga. Huwag gamitin ang pagbuti bilang patunay ng disease identity.
  monitoring_signs_day_10_en: Compare with Days 1 and 5. Record whether visible spread stopped or continued. Seek expert confirmation if new tissue
    becomes affected or deterioration continues.
  monitoring_signs_day_10_fil: Ihambing sa Day 1 at Day 5. Itala kung huminto o nagpatuloy ang nakikitang pagkalat. Humingi ng expert confirmation
    kung may bagong tissue na naapektuhan o nagpapatuloy ang pagkasira.
  escalation_guidance_en: Seek confirmation from a qualified agriculturist or plant pathologist if symptoms spread, plant vigor declines, fruit
    deterioration progresses, or the visible signs do not clearly match the source-defined condition.
  escalation_guidance_fil: Humingi ng kumpirmasyon mula sa qualified agriculturist o plant pathologist kung kumakalat ang sintomas, humihina ang
    halaman, lumalala ang pagkasira ng bunga, o hindi malinaw na tumutugma ang nakikitang palatandaan sa source-defined condition.
  uncertainty_note_en: Because leaf-specific Philippine symptom evidence was not located, seek confirmation when leaf signs are the main finding.
  uncertainty_note_fil: 'Draft translation pending expert review: Because leaf-specific Philippine symptom evidence was not located, seek confirmation
    when leaf signs are the main finding.'
  pesticide_recommendation: No verified recommendation found.
  pesticide_reason: No accessible Philippine product label was verified with the complete required use conditions and restrictions. FPA registration-table
    matches, where present, are recorded only as regulatory leads for reviewer follow-up.
