- fruit: Papaya
  variety: null
  disease_key: anthracnose
  disease_name_en: Papaya anthracnose
  disease_name_fil: Anthracnose ng papaya
  disease_scope: Specific disease documented in Philippine papaya fruit and extension references
  field_or_postharvest: both
  symptoms_en: Philippine fruit samples were reported with brown-to-black, sunken, water-soaked lesions. Extension guidance
    also describes sunken fruit spots.
  symptoms_fil: Sa mga sample ng bunga mula sa Pilipinas, naiulat ang lubog, water-soaked, kayumanggi hanggang itim na lesions.
    Inilalarawan din ng extension guidance ang lubog na batik sa bunga.
  prevention_en: Improve aeration, remove diseased fruits and plant parts, and harvest ripe fruit promptly.
  prevention_fil: Pagbutihin ang daloy ng hangin, alisin ang may sakit na bunga at bahagi ng halaman, at anihin agad ang hinog
    na bunga.
  cultural_management_en: Humidity management and removal of infected material are documented in extension guidance.
  cultural_management_fil: Nakadokumento sa extension guidance ang pamamahala ng halumigmig at pag-alis ng infected material.
  biological_or_mechanical_control_en: A University of Hawai‘i extension page describes immersing ripe fruit in 118°F water
    for 20 minutes. This non-Philippine treatment requires local expert review before any farmer-facing use.
  biological_or_mechanical_control_fil: Inilalarawan ng University of Hawai‘i extension page ang paglubog ng hinog na bunga
    sa 118°F na tubig sa loob ng 20 minuto. Kailangan ng lokal na expert review bago ito gamitin sa farmer-facing guidance.
