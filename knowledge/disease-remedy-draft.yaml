  disease_key: powdery_mildew
  disease_name_en: Papaya powdery mildew
  disease_name_fil: Powdery mildew ng papaya
  disease_scope: Specific fungal disease supported by non-Philippine extension evidence
  field_or_postharvest: field
  symptoms_en: Possible signs include powdery patches on the underside of leaves and powdery spots on immature fruit that
    may later leave gray scars or deform the fruit.
  symptoms_fil: Kabilang sa mga posibleng palatandaan ang pulbos na patches sa ilalim ng dahon at pulbos na batik sa murang
    bunga na maaaring mag-iwan ng abong peklat o magdulot ng deformity habang lumalaki.
  prevention_en: Improve aeration between plants and remove and destroy heavily mildewed leaves.
  prevention_fil: Pagbutihin ang daloy ng hangin sa pagitan ng mga halaman at alisin at sirain ang mga dahong malubhang may
    powdery mildew.
  cultural_management_en: The extension source also suggests humidity management, including lower-rainfall growing conditions
    where applicable.
  cultural_management_fil: Iminumungkahi rin ng extension source ang pamamahala ng halumigmig, kabilang ang mas mababang ulan
    na growing conditions kung naaangkop.
