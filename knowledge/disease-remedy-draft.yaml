    but no product-specific label details are supplied here, so no pesticide entry is proposed.
  safety_restrictions_fil: Binabanggit ng sanggunian ang pag-spray ng rehistradong fungicide sa scab-prone na lugar habang
    bata pa ang bunga, ngunit walang product-specific label details, kaya walang pestisidyong inilalagay sa draft.
  uncertainty_note_en: Seek confirmation because fruit surface injuries and other diseases may resemble scab.
